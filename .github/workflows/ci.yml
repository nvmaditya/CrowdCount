name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # CPU-only PyTorch: a fraction of the default CUDA download, same results for tests.
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install
        run: |
          pip install torch torchvision --index-url "$TORCH_INDEX"
          pip install -e ".[dev]"
      - run: pytest

  smoke:
    name: Demo end-to-end
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install
        run: |
          pip install torch torchvision --index-url "$TORCH_INDEX"
          pip install -e .
      - name: Cache demo video and weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/crowdcount
          key: crowdcount-assets-v1
      - name: Detector on the demo video
        run: >
          crowdcount detect --source demo --no-display --no-realtime --max-frames 60
          --model yolov8n.pt --conf 0.35 --min-area 800 --metrics-out runs/ci
      - name: Dashboard and API (the README quickstart)
        env:
          CROWDCOUNT_ADMIN_PASSWORD: ci-admin-password
        run: |
          crowdcount demo --port 8080 > demo.log 2>&1 &
          PID=$!
          for _ in $(seq 1 120); do
            curl -fsS localhost:8080/api/health 2>/dev/null | grep -q '"running"' && break
            sleep 1
          done
          curl -fsS localhost:8080/api/summary | python -m json.tool
          curl -fsS -o /dev/null localhost:8080/
          TOKEN=$(curl -fsS -X POST localhost:8080/api/auth/login -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-admin-password"}' | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl -fsS -H "Authorization: Bearer $TOKEN" localhost:8080/api/admin/zones | python -m json.tool
          kill -TERM "$PID"
          wait "$PID"
          cat demo.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-metrics
          path: |
            runs/ci
            demo.log
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: crowdcount:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the container
        run: |
          docker run -d --name cc -p 8080:8080 -e CROWDCOUNT_ADMIN_PASSWORD=ci-admin-password crowdcount:ci
          for _ in $(seq 1 180); do
            curl -fsS localhost:8080/api/health 2>/dev/null | grep -q '"running"' && break
            sleep 1
          done
          curl -fsS localhost:8080/api/summary | python3 -m json.tool
          docker stop --time 15 cc
          test "$(docker inspect -f '{{.State.ExitCode}}' cc)" = "0"
          docker logs cc
