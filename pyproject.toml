[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "crowdcount"
dynamic = ["version"]
description = "Real-time crowd monitoring: YOLO person detection, multi-object tracking, polygon zones and a live web dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Aditya Khandelwal" }]
keywords = ["computer-vision", "yolo", "yolo26", "object-tracking", "bytetrack", "crowd-counting", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "ultralytics>=8.4.192,<9",  # YOLO26 with its default NMS head
    "lap>=0.5.13",
    "opencv-python>=5.0.0.93,<6",
    "numpy>=2.2.6",
    "fastapi>=0.162.0,<1",
    "uvicorn>=0.54.0",
    "websockets>=16.1.1",
    "pydantic>=2.14.1,<3",
    "PyJWT>=2.15.1,<3",
    "bcrypt>=5.0.0,<6",
    "reportlab>=5.1.0,<6",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "httpx>=0.28.1",
    "ruff>=0.17.3",
]

[project.scripts]
crowdcount = "crowdcount.cli:main"

[project.urls]
Homepage = "https://github.com/nvmaditya/CrowdCount"
Repository = "https://github.com/nvmaditya/CrowdCount"
Issues = "https://github.com/nvmaditya/CrowdCount/issues"

[tool.hatch.version]
path = "src/crowdcount/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/crowdcount"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:crowdcount",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # line length is the formatter's job
    "B008",   # FastAPI's Depends()/Query() in argument defaults is idiomatic
    "RUF012", # mutable class attributes are fine in tests
]

[tool.ruff.lint.isort]
known-first-party = ["crowdcount"]
