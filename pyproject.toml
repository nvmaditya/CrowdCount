[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "crowdcount"
dynamic = ["version"]
description = "Real-time crowd monitoring: YOLOv8 person detection, multi-object tracking, polygon zones and a live web dashboard."
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE"]
authors = [{ name = "Aditya Khandelwal" }]
keywords = ["computer-vision", "yolov8", "object-tracking", "bytetrack", "crowd-counting", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "ultralytics>=8.3,<9",
    "lap>=0.5.12",
    "opencv-python>=4.8,<6",
    "numpy>=1.24",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29",
    "websockets>=12",
    "pydantic>=2.6,<3",
    "PyJWT>=2.8,<3",
    "bcrypt>=4.1,<6",
    "reportlab>=4.0,<6",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
crowdcount = "crowdcount.cli:main"

[project.urls]
Homepage = "https://github.com/nvmaditya/CrowdCount"
Repository = "https://github.com/nvmaditya/CrowdCount"
Issues = "https://github.com/nvmaditya/CrowdCount/issues"

[tool.hatch.version]
path = "src/crowdcount/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/crowdcount"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:crowdcount",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # line length is the formatter's job
    "B008",   # FastAPI's Depends()/Query() in argument defaults is idiomatic
    "RUF012", # mutable class attributes are fine in tests
]

[tool.ruff.lint.isort]
known-first-party = ["crowdcount"]
